<!doctype html>
<html lang="zh-CN">

    <meta charset="UTF-8" />

    <style>
      :root {
        --bg: #ffffff;
        --fg: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --card: #f8fafc;
        --accent: #7c3aed;
      }
      :root[data-theme='dark'] {
        --bg: #0f172a;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --line: #1e293b;
        --card: #16213a;
        --accent: #a78bfa;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        min-height: 100dvh;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .wrap { width: 100%; max-width: 520px; text-align: center; }
      .code {
        font-size: clamp(72px, 18vw, 128px);
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, var(--accent), #06b6d4);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
      }
      h1 { font-size: 21px; font-weight: 650; margin-bottom: 12px; letter-spacing: -0.01em; }
      p { color: var(--muted); font-size: 15px; line-height: 1.7; margin-bottom: 32px; }
      .path {
        display: inline-block;
        font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace;
        font-size: 13px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 10px;
        color: var(--fg);
        max-width: 100%;
        overflow-wrap: anywhere;
        margin-top: 4px;
      }
      .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      a {
        text-decoration: none;
        font-size: 14px;
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid var(--line);
        color: var(--fg);
        background: var(--card);
        transition: border-color 0.2s ease, transform 0.2s ease;
      }
      a:hover { border-color: var(--accent); transform: translateY(-1px); }

      a.primary:hover { opacity: 0.9; }
      @media (prefers-reduced-motion: reduce) {
