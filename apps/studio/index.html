<!doctype html>
<html lang="zh-CN">
  <head>
    <script>(function(){try{var r=localStorage.getItem('jack-tan-theme');var v=r?JSON.parse(r):null;var m=(v==='light'||v==='dark')?v:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var d=document.documentElement;d.setAttribute('data-theme',m);d.setAttribute('data-project','studio');}catch(e){}})();</script>
    <!-- 共享 vendor：四个应用复用同一份 React / ReactDOM / ReactRouter（见 scripts/build-vendor.mjs） -->
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react.js",
          "react/jsx-runtime": "/vendor/react.js",
          "react-dom": "/vendor/react-dom.js",
          "react-dom/client": "/vendor/react-dom.js",
          "react-router-dom": "/vendor/react-router.js"
        }
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Jack Tan Studio</title>
    <meta name="description" content="Jack Tan Studio — 创意工作室 · 音乐 · 排版 · 个人作品集" />
    <link rel="canonical" href="https://jacktan-studio.pages.dev/" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#06060a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jack Tan Studio" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jacktan-studio.pages.dev/" />
    <meta property="og:title" content="Jack Tan Studio" />
    <meta property="og:description" content="创意工作室 · 汇集音乐随记、社媒排版、个人作品集于一体。" />
    <meta property="og:image" content="https://jacktan-studio.pages.dev/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="480" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="Jack Tan Studio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jack Tan Studio" />
    <meta name="twitter:description" content="创意工作室 · 汇集音乐随记、社媒排版、个人作品集于一体。" />
    <meta name="twitter:image" content="https://jacktan-studio.pages.dev/og-cover.jpg" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100;0,400;0,500;0,600;0,700;1,100;1,400&family=Noto+Sans+SC:wght@100;400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      .boot-skeleton{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#fff;color:#64748b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .boot-logo{font-size:18px;font-weight:600;letter-spacing:.04em;opacity:.7}
      .boot-spinner{width:34px;height:34px;border-radius:50%;border:3px solid #e2e8f0;border-top-color:#6366f1;animation:boot-spin 1s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media (prefers-color-scheme:dark){.boot-skeleton{background:#0f172a;color:#94a3b8}.boot-spinner{border-color:#334155;border-top-color:#818cf8}}
      .boot-noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:system-ui,sans-serif;color:#475569;background:#fff;line-height:1.6}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-skeleton" aria-hidden="true">
        <div class="boot-logo">Jack Tan Studio</div>
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <div class="boot-noscript">本站点需要启用 JavaScript 才能正常运行。请开启 JavaScript 后刷新页面。</div>
    </noscript>
  </body>
</html>
