name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build all apps
        run: pnpm build

      - name: Merge dists for single-origin deploy
        run: pnpm merge

      - name: Route consistency check
        run: pnpm verify

      - name: Verify deploy artifacts
        run: |
          test -f deploy/dist/index.html
          test -f deploy/dist/_redirects
          test -f deploy/dist/_routes.json
          test -f deploy/dist/_headers
          test -f deploy/dist/projects/jack-wave/index.html
          test -f deploy/dist/projects/jack-pose/index.html
          test -f deploy/dist/projects/jack-tan/index.html
          echo "✅ Deploy artifacts verified"
