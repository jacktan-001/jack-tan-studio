name: CI

# P1-3：建立 develop / preview / PR 流程，杜绝直接推 main。
# - push main / develop 与 PR 到 main 都触发流水线；
# - build 负责质量门禁（typecheck / 构建 / 路由校验 / 产物校验），产物以 artifact 传递，
#   避免每个 job 重复构建；
# - preview job 在 PR 与 develop 推送时部署「预览环境」并把地址评论回 PR（需 PR 写权限）；
# - deploy-production job 仅在 push 到 main 时把预览态切换为生产态。
# 注意：main 分支还需在 GitHub 仓库设置里开启「分支保护」（见仓库 README / 下方说明），
# 要求 PR 审查 + 必须通过本 CI（status check）才能合并，从机制上禁止直推 main。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 最小权限原则：默认只给读权限；仅 preview job 在需要写 PR 评论时单独提升。
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version 从 package.json 的 packageManager 字段自动读取

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 供应链扫描：high/critical 漏洞直接让 CI 失败。
      # 已登记的已知例外（GHSA-only 告警，pnpm 10 不支持 ignoreCves 按 GHSA 豁免，故在此显式按 GHSA 过滤）：
      #   - GHSA-qwww-vcr4-c8h2  React Router RSC 模式 CSRF，仅影响 unstable RSC / Server Action，
      #     本站为纯客户端 SPA，无 RSC / 服务端 Action，实际不可利用。
      # 不要把这一步改成 continue-on-error，否则等同于没有扫描；新出现的高危漏洞仍会让 CI 失败。
      - name: Audit dependencies (high+)
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            let raw = "";
            try {
              raw = execFileSync("pnpm", ["audit", "--audit-level=high", "--json"], { encoding: "utf8" });
            } catch (e) {
              raw = (e.stdout || "").toString();
            }
            const j = JSON.parse(raw || "{}");
            const KNOWN = new Set(["GHSA-qwww-vcr4-c8h2"]);
            const advisories = j.advisories || {};
            const remaining = Object.values(advisories).filter(a => !KNOWN.has(a.github_advisory_id));
            if (remaining.length > 0) {
              console.error("pnpm audit: " + remaining.length + " unhandled high/critical vulnerability(ies):");
              for (const a of remaining) console.error("  - " + (a.github_advisory_id || a.id) + " (" + a.severity + "): " + (a.title || ""));
              process.exit(1);
            }
            console.log("OK: no unhandled high/critical vulns (1 known exception ignored: GHSA-qwww-vcr4-c8h2 = React Router RSC-mode CSRF, N/A to this client-only SPA).");
          '

      - name: Type check
        run: pnpm typecheck

      - name: Build all apps
        run: pnpm build

      - name: Merge dists for single-origin deploy
        env:
          # 可选：设置后 merge 脚本会向各入口注入 Cloudflare Web Analytics beacon
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: pnpm merge

      - name: Route consistency check
        run: pnpm verify

      - name: Verify deploy artifacts
        env:
          # 通过 env 传递而非在 run 脚本里直接内插 ${{ secrets.* }}，
          # 避免密钥值被拼进 shell 命令文本（可能出现在日志/进程列表中）
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          test -f deploy/dist/index.html
          test -f deploy/dist/_redirects
          test -f deploy/dist/_routes.json
          test -f deploy/dist/_headers
          test -f deploy/dist/404.html
          test -f deploy/dist/robots.txt
          test -f deploy/dist/sitemap.xml
          test -f deploy/dist/projects/jack-wave/index.html
          test -f deploy/dist/projects/jack-pose/index.html
          test -f deploy/dist/projects/jack-tan/index.html
          # SPA 回退必须走 Pages Function；_redirects 的 200 重写会吞掉子应用全部静态资源。
          # 回退 Function 的位置随 SPA_MODE 变化：
          #   studio（默认）     → deploy/functions/projects/{id}/[[path]].js       回退 studio 外壳
          #   standalone（回退） → deploy/functions/projects/jack-{id}/[[path]].js  回退子应用自身
          # 此处只断言「存在其一」，模式一致性由 scripts/verify-routes.mjs 精确校验。
          for id in wave pose tan; do
            test -f "deploy/functions/projects/$id/[[path]].js" \
              || test -f "deploy/functions/projects/jack-$id/[[path]].js" \
              || { echo "缺少 $id 的 SPA 回退 Function"; exit 1; }
          done
          # ── P0 回归防护：共享 vendor 必须含具名导出，否则线上 React 白屏 ──
          # esbuild 对 CJS 的 `export *` 不会提升具名导出，历史上因此全站白屏。
          test -f deploy/dist/vendor/react.js
          test -f deploy/dist/vendor/react-dom.js
          test -f deploy/dist/vendor/react-router.js
          # react.js：含 useMemo / jsxs（应用 chunk 以具名方式 import）
          grep -qE '(export\s+(const\s+)?useMemo\b|export\{[^}]*\buseMemo\b)' deploy/dist/vendor/react.js
          grep -qE '(export\s+(const\s+)?jsxs\b|export\{[^}]*\bjsxs\b)' deploy/dist/vendor/react.js
          # react-dom.js：含 createRoot（react-dom/client 的入口）
          grep -qE '(export\s+(const\s+)?createRoot\b|export\{[^}]*\bcreateRoot\b)' deploy/dist/vendor/react-dom.js
          # react-dom.js：必须含 require 垫片 banner（`__vendor_react_ns`），
          # 否则 esbuild 的 `Dynamic require of "react" is not supported` 会致 React 挂载失败白屏。
          grep -q "__vendor_react_ns" deploy/dist/vendor/react-dom.js
          # react-dom.js：必须提供 default 导出（来自 react-dom/client）。
          # jack-pose / jack-tan 用 `import ReactDOM from 'react-dom/client'` 默认导入后调用
          # ReactDOM.createRoot；若 default 缺失，则默认导入为 undefined → "createRoot is not a function"。
          grep -qE "export\{[^}]*\b(as )?default\b" deploy/dist/vendor/react-dom.js
          # react-router.js：含 Link / useNavigate
          grep -qE '(export\s+(const\s+)?Link\b|export\{[^}]*\bLink\b)' deploy/dist/vendor/react-router.js
          # 每个入口 index.html 必须含 importmap（否则裸模块名无法解析）
          grep -q 'importmap' deploy/dist/index.html
          grep -q 'importmap' deploy/dist/projects/jack-pose/index.html
          grep -q 'importmap' deploy/dist/projects/jack-wave/index.html
          grep -q 'importmap' deploy/dist/projects/jack-tan/index.html
          # jack-pose 的 CSP 必须与全局对齐（含 unsafe-inline），否则 importmap 被拦截白屏
          grep -qE "script-src 'self' 'unsafe-inline'" deploy/dist/_headers
          # 断言 jack-pose 专属块自身的 script-src 也含 unsafe-inline
          test "$(awk '/^\/projects\/jack-pose\//{p=1} p&&/Content-Security-Policy/{print;exit}' deploy/dist/_headers)" != ""
          awk '/^\/projects\/jack-pose\//{p=1} p&&/Content-Security-Policy/{print;exit}' deploy/dist/_headers | grep -qE "script-src 'self' 'unsafe-inline'"
          ! grep -qE '^/projects/jack-[a-z]+/\* /projects/jack-[a-z]+/ 200' deploy/dist/_redirects
          # SEO 产物内容校验：robots 必须声明 sitemap，且不得残留已失效的旧域名
          grep -q "Sitemap: https://jacktan-studio.pages.dev/sitemap.xml" deploy/dist/robots.txt
          ! grep -rqE "jacktan\.pages\.dev|jack-pose\.pages\.dev|jack-wave\.pages\.dev" deploy/dist/robots.txt deploy/dist/sitemap.xml
          # 兜底规则必须已移除，否则未知路径会被软 404 吞掉
          ! grep -qE '^/\* /index\.html 200' deploy/dist/_redirects
          # Web Analytics beacon：仅当配置了 token 时校验已注入
          if [ -n "$CLOUDFLARE_WEB_ANALYTICS_TOKEN" ]; then
            grep -q "data-cf-beacon" deploy/dist/index.html
            grep -q "data-cf-beacon" deploy/dist/projects/jack-pose/index.html
          fi
          echo "✅ Deploy artifacts verified"

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: deploy
          if-no-files-found: error

  preview:
    # PR 到 main，或 push 到 develop 时部署预览环境；仅 PR 事件会评论预览地址。
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy
          path: deploy

      - name: Install dependencies (provides wrangler for pnpm exec)
        run: pnpm install --frozen-lockfile

      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          PR_NUM="${{ github.event.pull_request.number }}"
          # PR 用 preview-<编号>，develop 推送用 preview-develop，保证别名稳定可追踪。
          BRANCH="preview-${PR_NUM:-develop}"
          URL=$(pnpm exec wrangler --cwd deploy pages deploy dist \
            --project-name jacktan-studio \
            --branch "$BRANCH" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${COMMIT_MSG}" 2>&1 | grep -oE 'https://[^ ]+\.pages\.dev' | tail -1)
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "预览部署地址: $URL"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const sha = context.sha.substring(0, 8);
            const body = `### 🔍 预览部署已就绪\n\n- 提交: \`${sha}\`\n- 预览地址: ${url}\n\n> 此预览随 PR 更新自动刷新；合并到 main 后由生产流水线接管。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '预览部署已就绪';
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-production:
    # 仅 push 到 main 时生效：把产物部署为生产态。
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy
          path: deploy

      - name: Install dependencies (provides wrangler for pnpm exec)
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          # 注意两个 cwd 陷阱：
          # 1. pnpm exec 会把工作目录重置到仓库根，因此不能先 `cd deploy`；
          # 2. wrangler 从「当前工作目录」发现 functions/ 目录，必须用 --cwd deploy
          #    指到 deploy/（functions 在 deploy/functions），否则 Functions 会被
          #    静默跳过 —— 曾导致 /projects/jack-wave/api/* 与 SPA 回退全部 404。
          pnpm exec wrangler --cwd deploy pages deploy dist \
            --project-name jacktan-studio \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${COMMIT_MSG}"

      - name: Deployment summary
        run: |
          {
            echo "### 部署完成"
            echo ""
            echo "- 提交: \`${GITHUB_SHA:0:8}\` $(git log -1 --pretty=%s)"
            echo "- 生产: https://jacktan-studio.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
