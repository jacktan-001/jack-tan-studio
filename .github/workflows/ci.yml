name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build all apps
        run: pnpm build

      - name: Merge dists for single-origin deploy
        run: pnpm merge

      - name: Route consistency check
        run: pnpm verify

      - name: Verify deploy artifacts
        run: |
          test -f deploy/dist/index.html
          test -f deploy/dist/_redirects
          test -f deploy/dist/_routes.json
          test -f deploy/dist/_headers
          test -f deploy/dist/projects/jack-wave/index.html
          test -f deploy/dist/projects/jack-pose/index.html
          test -f deploy/dist/projects/jack-tan/index.html
          echo "✅ Deploy artifacts verified"

      # 仅在 push 到 main 分支时部署（PR 不部署）
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: cd deploy && npx wrangler pages deploy dist --project-name jacktan-studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
