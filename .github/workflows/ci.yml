name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build all apps
        run: pnpm build

      - name: Merge dists for single-origin deploy
        env:
          # 可选：设置后 merge 脚本会向各入口注入 Cloudflare Web Analytics beacon
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: pnpm merge

      - name: Route consistency check
        run: pnpm verify

      - name: Verify deploy artifacts
        run: |
          test -f deploy/dist/index.html
          test -f deploy/dist/_redirects
          test -f deploy/dist/_routes.json
          test -f deploy/dist/_headers
          test -f deploy/dist/404.html
          test -f deploy/dist/robots.txt
          test -f deploy/dist/sitemap.xml
          test -f deploy/dist/projects/jack-wave/index.html
          test -f deploy/dist/projects/jack-pose/index.html
          test -f deploy/dist/projects/jack-tan/index.html
          # SPA 回退必须走 Pages Function；_redirects 的 200 重写会吞掉子应用全部静态资源
          test -f 'deploy/functions/projects/jack-wave/[[path]].js'
          test -f 'deploy/functions/projects/jack-pose/[[path]].js'
          test -f 'deploy/functions/projects/jack-tan/[[path]].js'
          ! grep -qE '^/projects/jack-[a-z]+/\* /projects/jack-[a-z]+/ 200' deploy/dist/_redirects
          # SEO 产物内容校验：robots 必须声明 sitemap，且不得残留已失效的旧域名
          grep -q "Sitemap: https://jacktan-studio.pages.dev/sitemap.xml" deploy/dist/robots.txt
          ! grep -rqE "jacktan\.pages\.dev|jack-pose\.pages\.dev|jack-wave\.pages\.dev" deploy/dist/robots.txt deploy/dist/sitemap.xml
          # 兜底规则必须已移除，否则未知路径会被软 404 吞掉
          ! grep -qE '^/\* /index\.html 200' deploy/dist/_redirects
          # Web Analytics beacon：仅当配置了 token 时校验已注入
          if [ -n "${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}" ]; then
            grep -q "data-cf-beacon" deploy/dist/index.html
            grep -q "data-cf-beacon" deploy/dist/projects/jack-pose/index.html
          fi
          echo "✅ Deploy artifacts verified"

      # 仅在 push 到 main 分支时部署（PR 不部署）
      #
      # 使用 pnpm exec 调用 lockfile 锁定的 wrangler 版本，而非 npx 拉取浮动版本，
      # 保证部署工具链可复现。
      #
      # --commit-hash / --commit-message / --branch 让「线上版本 ⇄ git commit」可双向溯源，
      # 避免再次出现「Cloudflare 有部署记录、仓库里却查无此提交」的断链情况。
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          # 注意两个 cwd 陷阱：
          # 1. pnpm exec 会把工作目录重置到仓库根，因此不能先 `cd deploy`；
          # 2. wrangler 从「当前工作目录」发现 functions/ 目录，必须用 --cwd deploy
          #    指到 deploy/（functions 在 deploy/functions），否则 Functions 会被
          #    静默跳过 —— 曾导致 /projects/jack-wave/api/* 与 SPA 回退全部 404。
          pnpm exec wrangler --cwd deploy pages deploy dist \
            --project-name jacktan-studio \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${COMMIT_MSG}"

      - name: Deployment summary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          {
            echo "### 部署完成"
            echo ""
            echo "- 提交: \`${GITHUB_SHA:0:8}\` $(git log -1 --pretty=%s)"
            echo "- 生产: https://jacktan-studio.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
