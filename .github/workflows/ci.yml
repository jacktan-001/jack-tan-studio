name: CI

# P1-3：建立 develop / preview / PR 流程，杜绝直接推 main。
# - push main / develop 与 PR 到 main 都触发流水线；
# - build 负责质量门禁（typecheck / 构建 / 路由校验 / 产物校验），产物以 artifact 传递，
#   避免每个 job 重复构建；
# - preview job 在 PR 与 develop 推送时部署「预览环境」并把地址评论回 PR（需 PR 写权限）；
# - deploy-production job 仅在 push 到 main 时把预览态切换为生产态。
# 注意：main 分支还需在 GitHub 仓库设置里开启「分支保护」（见仓库 README / 下方说明），
# 要求 PR 审查 + 必须通过本 CI（status check）才能合并，从机制上禁止直推 main。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# 最小权限原则：默认只给读权限；仅 preview job 在需要写 PR 评论时单独提升。
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version 从 package.json 的 packageManager 字段自动读取

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build all apps
        run: pnpm build

      - name: Merge dists for single-origin deploy
        env:
          # 可选：设置后 merge 脚本会向各入口注入 Cloudflare Web Analytics beacon
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: pnpm merge

      - name: Route consistency check
        run: pnpm verify

      - name: Verify deploy artifacts
        run: |
          test -f deploy/dist/index.html
          test -f deploy/dist/_redirects
          test -f deploy/dist/_routes.json
          test -f deploy/dist/_headers
          test -f deploy/dist/404.html
          test -f deploy/dist/robots.txt
          test -f deploy/dist/sitemap.xml
          test -f deploy/dist/projects/jack-wave/index.html
          test -f deploy/dist/projects/jack-pose/index.html
          test -f deploy/dist/projects/jack-tan/index.html
          # SPA 回退必须走 Pages Function；_redirects 的 200 重写会吞掉子应用全部静态资源
          test -f 'deploy/functions/projects/jack-wave/[[path]].js'
          test -f 'deploy/functions/projects/jack-pose/[[path]].js'
          test -f 'deploy/functions/projects/jack-tan/[[path]].js'
          ! grep -qE '^/projects/jack-[a-z]+/\* /projects/jack-[a-z]+/ 200' deploy/dist/_redirects
          # SEO 产物内容校验：robots 必须声明 sitemap，且不得残留已失效的旧域名
          grep -q "Sitemap: https://jacktan-studio.pages.dev/sitemap.xml" deploy/dist/robots.txt
          ! grep -rqE "jacktan\.pages\.dev|jack-pose\.pages\.dev|jack-wave\.pages\.dev" deploy/dist/robots.txt deploy/dist/sitemap.xml
          # 兜底规则必须已移除，否则未知路径会被软 404 吞掉
          ! grep -qE '^/\* /index\.html 200' deploy/dist/_redirects
          # Web Analytics beacon：仅当配置了 token 时校验已注入
          if [ -n "${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}" ]; then
            grep -q "data-cf-beacon" deploy/dist/index.html
            grep -q "data-cf-beacon" deploy/dist/projects/jack-pose/index.html
          fi
          echo "✅ Deploy artifacts verified"

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: deploy
          if-no-files-found: error

  preview:
    # PR 到 main，或 push 到 develop 时部署预览环境；仅 PR 事件会评论预览地址。
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy
          path: deploy

      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          PR_NUM="${{ github.event.pull_request.number }}"
          # PR 用 preview-<编号>，develop 推送用 preview-develop，保证别名稳定可追踪。
          BRANCH="preview-${PR_NUM:-develop}"
          URL=$(pnpm exec wrangler --cwd deploy pages deploy dist \
            --project-name jacktan-studio \
            --branch "$BRANCH" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${COMMIT_MSG}" 2>&1 | grep -oE 'https://[^ ]+\.pages\.dev' | tail -1)
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "预览部署地址: $URL"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const sha = context.sha.substring(0, 8);
            const body = `### 🔍 预览部署已就绪\n\n- 提交: \`${sha}\`\n- 预览地址: ${url}\n\n> 此预览随 PR 更新自动刷新；合并到 main 后由生产流水线接管。`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '预览部署已就绪';
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  deploy-production:
    # 仅 push 到 main 时生效：把产物部署为生产态。
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy
          path: deploy

      - name: Deploy to Cloudflare Pages (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%s)"
          # 注意两个 cwd 陷阱：
          # 1. pnpm exec 会把工作目录重置到仓库根，因此不能先 `cd deploy`；
          # 2. wrangler 从「当前工作目录」发现 functions/ 目录，必须用 --cwd deploy
          #    指到 deploy/（functions 在 deploy/functions），否则 Functions 会被
          #    静默跳过 —— 曾导致 /projects/jack-wave/api/* 与 SPA 回退全部 404。
          pnpm exec wrangler --cwd deploy pages deploy dist \
            --project-name jacktan-studio \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${COMMIT_MSG}"

      - name: Deployment summary
        run: |
          {
            echo "### 部署完成"
            echo ""
            echo "- 提交: \`${GITHUB_SHA:0:8}\` $(git log -1 --pretty=%s)"
            echo "- 生产: https://jacktan-studio.pages.dev"
          } >> "$GITHUB_STEP_SUMMARY"
