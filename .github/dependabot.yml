version: 2

updates:
  # ---------- npm / pnpm 依赖 ----------
  # 本仓库是 pnpm workspace，Dependabot 从根 pnpm-lock.yaml 解析全部 workspace 包，
  # 因此只需声明根目录一个 npm ecosystem，不必为每个 app 单独配置。
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - dependencies
    groups:
      # 把补丁/次版本升级合并成一个 PR，避免每周被十几个 PR 淹没
      minor-and-patch:
        update-types:
          - minor
          - patch
      # React 生态必须整体同步升级，拆开升会出现版本错配
      react:
        patterns:
          - react
          - react-dom
          - react-router*
          - "@types/react"
          - "@types/react-dom"
      # 构建链同理
      build-toolchain:
        patterns:
          - vite
          - "@vitejs/*"
          - turbo
          - typescript
          - tailwindcss
          - "@tailwindcss/*"
    ignore:
      # major 升级由人工评估，不自动开 PR（React 19 → 20 这类需要迁移工作）
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # ---------- GitHub Actions ----------
  # actions 的 major 升级需要自动跟进，否则会长期停留在被弃用的版本上
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci
